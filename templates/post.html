<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='post.css') }}">
</head>
<body>
    <p><a href="{{ url_for('blogapp.blog') }}">&lt;- Back to All Posts</a></p>
    <div class="parent">
        <div class="child">
            <article>
                <h1>{{ post.title }}</h1>
                <hr>
                <p class="body"><small>Published on {{ post.date }}</small></p>
                <div class="body">
                    {{ post.content }}
                </div>
            </article>
        </div>
    </div>
</body>
</html>
