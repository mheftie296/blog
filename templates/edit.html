<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Post - {{ post.title }}</title>
    <style>
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; font-weight: bold; margin-bottom: 0.3rem; }
        input[type="text"], textarea { width: 100%; padding: 0.5rem; box-sizing: border-box; }
        textarea { height: 200px; font-family: inherit; }
        .btn { padding: 0.6rem 1.2rem; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        .btn-cancel { background: #6c757d; text-decoration: none; padding: 0.6rem 1.2rem; color: white; border-radius: 4px; display: inline-block; }
    </style>
</head>
<body>
    <h1>Edit Post</h1>

    <form method="POST" action="{{ url_for('blogapp.edit_post', post_id=post.url) }}">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" value="{{ post.title }}" required>
        </div>

        <div class="form-group">
            <label for="slug">URL Slug</label>
            <input type="text" id="slug" name="slug" value="{{ post.url }}" required>
        </div>

        <div class="form-group">
            <label for="date">Date</label>
            <input type="text" id="date" name="date" value="{{ post.date }}" required>
        </div>

        <div class="form-group">
            <label for="summary">Summary</label>
            <input type="text" id="summary" name="summary" value="{{ post.summary or '' }}">
        </div>

        <div class="form-group">
            <label for="content">Content (HTML or Markdown)</label>
            <textarea id="content" name="content" required>{{ post.content }}</textarea>
        </div>

        <button type="submit" class="btn">Save Changes</button>
        <a href="{{ url_for('blogapp.show_post', slug=post.slug) }}" class="btn-cancel">Cancel</a>
    </form>
</body>
</html>
